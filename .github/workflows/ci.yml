name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit + regression + parity
        run: node --test tests/*.test.js
      - name: Guide reproducible
        run: python tools/build_guide.py --check
      - name: Generated artifacts in sync
        run: node tools/sync_assets.js --check
      - name: Extension manifest
        run: node tools/check_extension.js
      - name: extension/core in sync
        run: python tools/sync_core.py --check
